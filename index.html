<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Места на карте</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
      #map {
        height: 100%;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      .leaflet-touch .leaflet-control-attribution {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
      let map
      let markers = []

      // Функция инициализации карты
      function initMap() {
        const urlParams = new URLSearchParams(window.location.search)
        const count = parseInt(urlParams.get('count'))

        // Инициализация карты с OpenStreetMap
        map = L.map('map').setView([0, 0], 17)

        // Добавление слоя OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        }).addTo(map)

        // Добавление маркеров
        for (let i = 1; i <= count; i++) {
          const latLng = urlParams.get(`marker${i}`)
          const description = urlParams.get(`description${i}`)

          if (latLng) {
            const [lat, lng] = latLng
              .split(',')
              .map((coord) => parseFloat(coord))

            // Создаем маркер
            const marker = L.marker([lat, lng]).addTo(map)
            markers.push(marker)

            // Создание инфо-окна
            const popupContent = `<strong>${description}</strong>`

            // Добавление инфо-окна к маркеру
            marker.bindPopup(popupContent)

            // Если это первый маркер, центрируем карту на нем
            if (i === 1) {
              map.setView([lat, lng], 20)
            }
          }
        }
      }
      // Инициализация карты
      initMap()
    </script>
  </body>
</html>
